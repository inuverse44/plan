name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: Playwright 1.56 has no browsers for Ubuntu 26.04 (ubuntu-latest since 2026-10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Install wasm-bindgen
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.100/wasm-bindgen-0.2.100-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /usr/local/bin --strip-components=1 wasm-bindgen-0.2.100-x86_64-unknown-linux-musl/wasm-bindgen
      - name: Build (types, WASM, UI, CLI)
        run: ./build.sh
      - name: Generated TypeScript types are committed
        run: git diff --exit-code web/src/contracts.d.ts
      - name: Test
        run: cargo test --release --workspace
      - name: Install the UI test runner (Playwright, Chromium)
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: UI tests (e2e)
        working-directory: e2e
        run: npm test
      - name: Keep the UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REPO }}/plan:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }} --quiet
