[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
indexmap = { version = "2", features = ["serde"] }
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"
plan-contracts = { path = "crates/plan-contracts" }
plan-engines = { path = "crates/plan-engines" }
plan-access = { path = "crates/plan-access" }
plan-manager = { path = "crates/plan-manager" }

[profile.release]
opt-level = 3
lto = true
